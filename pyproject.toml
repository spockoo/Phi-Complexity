[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phi-complexity"
version = "0.13.0"
description = "Multi-language code quality metrics based on Golden Ratio (φ) mathematical invariants and adiabatic equilibrium"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Tomy Verreault", email = "contact@phidelia.dev"}
]
keywords = [
    "code-quality", "complexity", "golden-ratio", "fibonacci",
    "static-analysis", "ast", "tree-sitter", "multi-language",
    "phi", "metrics", "entropy"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.9"
dependencies = []  # Zéro dépendance pour l'audit Python — Souveraineté totale

[project.optional-dependencies]
multilang = [
    "tree-sitter>=0.21,<1.0",
    "tree-sitter-language-pack>=0.13",
]

[project.scripts]
phi = "phi_complexity.cli:main"

[project.urls]
Homepage = "https://github.com/spockoo/phi-complexity"
Repository = "https://github.com/spockoo/phi-complexity"
Documentation = "https://github.com/spockoo/phi-complexity/blob/main/docs/GUIDE.md"
"Bug Tracker" = "https://github.com/spockoo/phi-complexity/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["phi_complexity*"]
