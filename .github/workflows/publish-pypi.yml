# Publication PyPI via Trusted Publishing (OIDC) — plus de clé API.
#
# Déclenchement : quand une release GitHub est publiée.
# Le job s'authentifie auprès de PyPI par échange de jeton OIDC ;
# aucun secret n'est stocké dans le dépôt.
#
# PRÉREQUIS CÔTÉ PYPI (à faire une fois, par le mainteneur) :
#   https://pypi.org/manage/project/phi-complexity/settings/publishing/
#   → "Add a new publisher" → GitHub :
#     - Owner : spockoo
#     - Repository : Phi-Complexity
#     - Workflow name : publish-pypi.yml   (ce fichier, nom exact requis)
#     - Environment : (laisser vide)
#
# PROCESSUS DE RELEASE :
#   1. Bumper la version dans pyproject.toml + merger sur main
#   2. Créer le tag vX.Y.Z et la release GitHub
#   3. Ce workflow build et publie automatiquement sur PyPI.

name: publish-pypi

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC : échange de jeton avec PyPI (Trusted Publishing)
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Vérifier que la version du tag correspond à pyproject.toml
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$TAG pyproject=$PKG_VERSION"
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "ERREUR : le tag v$TAG ne correspond pas à la version $PKG_VERSION de pyproject.toml" >&2
            exit 1
          fi

      - name: Build sdist + wheel
        run: |
          pip install build
          python -m build

      - name: Publier sur PyPI (OIDC, sans clé)
        uses: pypa/gh-action-pypi-publish@release/v1
